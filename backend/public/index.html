<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-economy</title>
<style>
  body { font: 13px ui-monospace, Menlo, monospace; margin: 16px; background: #fff; color: #111; }
  h1 { font-size: 18px; margin: 0; display: inline; }
  button { font: inherit; padding: 4px 14px; cursor: pointer; }
  a { color: #2458a6; }
  .top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 6px; }
  .top button { font-size: 15px; padding: 6px 20px; font-weight: bold; }
  #status { font-size: 14px; }
  #brainpick select, #agentpick input { font: inherit; padding: 3px 4px; }
  #agentpick input { width: 4.5em; }
  #brainpick[hidden], #agentpick[hidden] { display: none; }
  td.model, th.model { color: #555; font-size: 11px; }
  table.nomodels .model { display: none; }      /* one brain, one model: the column says nothing */
  #models { color: #444; margin: 0 0 10px; line-height: 1.6; font-size: 12px; }
  #models b { color: #111; }
  #headline { color: #444; margin: 4px 0 12px; line-height: 1.6; }
  .box { border: 1px solid #ccc; padding: 8px 10px; margin: 10px 0; }
  table { border-collapse: collapse; width: 100%; }
  td, th { padding: 2px 8px; border-bottom: 1px solid #eee; text-align: left; white-space: nowrap; }
  td.n, th.n { text-align: right; }
  td.t { white-space: normal; color: #555; }
  .hungry { color: #b00; }
  .muted { color: #666; }
  .chart { border: 1px solid #ccc; padding: 6px 8px; width: 300px; box-sizing: border-box; }
  .chart svg { display: block; width: 100%; height: auto; }
  .chart .head { display: flex; justify-content: space-between; margin-bottom: 2px; }
  .up { color: #1a7f37; } .down { color: #b00; }

  /* the headline charts: two columns on a laptop, one on a narrow screen */
  .big { display: grid; grid-template-columns: repeat(auto-fit, minmax(460px, 1fr)); gap: 12px; margin: 12px 0; }
  .big .chart { width: auto; padding: 8px 12px; }
  .big .chart .head b { font-size: 14px; }
  .col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  #cb-panel:empty { display: none; }       /* reserved: the central-bank controls go here, above money & credit */

  /* the small tiles: a number and a sparkline, click to open the full chart */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(108px, 1fr)); gap: 8px; margin: 12px 0 0; }
  .tile { border: 1px solid #ccc; padding: 6px 8px; cursor: pointer; user-select: none; }
  .tile:hover { border-color: #888; }
  .tile.on { border-color: #2458a6; box-shadow: inset 0 -2px 0 #2458a6; }
  .tile .lab { color: #666; font-size: 11px; display: flex; justify-content: space-between; gap: 6px; white-space: nowrap; overflow: hidden; }
  .tile .lab span:last-child { overflow: hidden; text-overflow: ellipsis; color: #999; }
  .tile .val { font-size: 18px; font-weight: bold; margin: 2px 0; }
  .tile svg { display: block; width: 100%; height: 26px; }
  #tile-open { margin-top: 8px; }
  #tile-open .chart { width: auto; }

  #wealth svg { display: block; width: 100%; height: auto; }
  #bankfeed .feed { max-height: 420px; overflow-y: auto; margin-top: 4px; border-top: 1px solid #eee; padding-top: 4px; }
  #bankfeed .feed div { padding: 1px 0; }

  /* the control panel: a drawer on the right, so the charts keep running beside it.
     On a wide screen the page makes room for it rather than hiding behind it. */
  #panel { position: fixed; top: 0; right: 0; bottom: 0; width: 404px; max-width: 94vw; overflow-y: auto;
           background: #fff; border-left: 1px solid #bbb; box-shadow: -6px 0 18px rgba(0,0,0,.07);
           padding: 12px 14px 80px; z-index: 50; transform: translateX(101%); transition: transform .18s ease; }
  #panel.open { transform: none; }
  @media (min-width: 1180px) { body.dials-open { margin-right: 412px; } }
  #panel h2 { font-size: 14px; margin: 0; display: inline; }
  #panel .close { float: right; border: 1px solid #ccc; background: #fff; padding: 1px 8px; }
  #panel .blurb { color: #666; margin: 6px 0 10px; line-height: 1.5; }
  .presets { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
  .presets button { font-size: 11px; padding: 3px 8px; border: 1px solid #ccc; background: #fafafa; }
  .presets button:hover { border-color: #c77700; background: #fff7ec; }
  .presets button.base { border-color: #aaa; background: #f0f0f0; }
  #panel .grp { border-top: 1px solid #ddd; margin-top: 12px; padding-top: 8px; }
  #panel .grp > .gh { font-weight: bold; }
  #panel .grp > .gb { color: #888; font-size: 11px; margin-bottom: 6px; }
  .dial { margin: 0 0 9px; }
  .dial .dl { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .dial .dl span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dial .dv { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .dial.moved .dv { color: #c77700; }
  .dial .rst { border: 0; background: none; color: #c77700; cursor: pointer; padding: 0 0 0 4px; font: inherit; }
  .dial input[type=range] { width: 100%; margin: 2px 0 0; accent-color: #2458a6; }
  .dial.moved input[type=range] { accent-color: #c77700; }
  .dial .dh { color: #888; font-size: 11px; line-height: 1.45; }
  .dial .next { color: #888; font-size: 10px; border: 1px solid #ddd; padding: 0 4px; margin-left: 4px; }
  #pfeed { margin-top: 12px; border-top: 1px solid #ddd; padding-top: 8px; line-height: 1.5; }
  #pfeed div { color: #c77700; }

  details.more { border: 1px solid #ccc; padding: 6px 10px; margin: 12px 0; }
  details.more > summary { cursor: pointer; font-weight: bold; padding: 2px 0; }
  .small { display: flex; gap: 12px; flex-wrap: wrap; margin: 10px 0; }
  .scroll { overflow-x: auto; }
  h3 { font-size: 13px; margin: 14px 0 4px; }
</style>

<div class="top">
  <h1>agent-economy</h1>
  <a href="/">← Island view</a>
  <button id="btn" onclick="toggle()">…</button>
  <label id="brainpick" class="muted">brain <select id="brainsel"></select></label>
  <label id="agentpick" class="muted">villagers <input id="agentsel" type="number" min="1" step="1"></label>
  <button id="dialsbtn" onclick="toggleDials()">dials ⚙</button>
  <span id="status"></span>
</div>
<div id="headline"></div>
<div id="models"></div>

<div id="panel">
  <button class="close" onclick="toggleDials()">close</button>
  <h2>the dials</h2>
  <div class="presets" id="presets"></div>
  <div id="dialgroups"></div>
  <div id="pfeed"></div>
</div>

<div id="dash" style="display:none">
  <div class="tiles" id="tiles"></div>
  <div id="tile-open"></div>

  <div class="big">
    <div class="chart" id="k-gdp"></div>
    <div class="col">
      <div id="cb-panel"></div>
      <div class="chart" id="k-money"></div>
    </div>
    <div class="chart" id="k-prices"></div>
    <div class="chart" id="k-jobs"></div>
    <div class="chart" id="wealth"></div>
    <div class="chart" id="bankfeed"></div>
    <div class="chart" id="txfeed"></div>
  </div>

  <details class="more" id="more">
    <summary>details: order book, loans, needs, goods, per-good prices, round log, every agent</summary>
    <div class="box" id="world"></div>
    <div class="small">
      <div class="box" id="book" style="margin:0; min-width:300px; flex:1"></div>
    </div>
    <div class="small">
      <div class="chart" id="k-fore"></div><div class="chart" id="k-needs"></div>
      <div class="chart" id="k-held"></div><div class="chart" id="k-slack"></div>
    </div>
    <div class="small">
      <div class="chart" id="c0"></div><div class="chart" id="c1"></div><div class="chart" id="c2"></div><div class="chart" id="c4"></div>
    </div>
    <h3>round log</h3>
    <div class="box" id="events" style="margin-top:0"></div>
    <h3>agents <button id="allbtn" onclick="showAll = !showAll; agentTable()" style="font-size:11px; padding:1px 8px"></button></h3>
    <div class="scroll"><table>
      <thead><tr>
        <th>agent</th><th>skills f/w/n</th><th>doing</th><th class="n">cash</th><th class="n">food</th>
        <th class="n">wood</th><th class="n">nets</th><th>house</th><th class="n">hunger</th><th class="n">cold</th>
        <th class="n">wellbeing</th><th class="n">net worth</th><th class="n">debt</th><th class="n">due</th><th class="model">model</th><th>standing orders</th><th>last thought</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </details>
</div>

<script>
const $ = id => document.getElementById(id);
const btn = $("btn"), statusEl = $("status"), world = $("world"), events = $("events"), rows = $("rows");
const GN = ['food', 'wood', 'nets', 'boats', 'houses'];  // good index -> name, same order as the chain
const GC = ['#2f7fc1', '#8a5a2b', '#7b4fb0', '#333', '#c77700'];   // one colour per good, used everywhere
const SHOWN = [0, 1, 2, 4];          // goods with a chart of their own; boats (3) are a dead slot nothing makes
const goodsList = q => q.map((n, g) => n ? `${n} ${GN[g]}` : '').filter(Boolean).join(', ');
const pct = v => `${v > 0 ? '+' : ''}${(v * 100).toFixed(1)}%`;
let running = false;
let last = null;                     // last /state, so hover can redraw without a fetch
let showAll = false;                 // agent table: top 10 by net worth, or everyone
const hover = GN.map(() => null);   // hovered round index per chart
const detailsOpen = () => $('more').open;
// a Solana explorer link for a transaction, on the same cluster as the ledger link the server gives
const txUrl = sig => last.chain.explorer.replace(/\/address\/[^?]+/, '/tx/' + sig);

// Every transaction the village has just made, newest first, with what it did and a link
// to it on the explorer. A trade in the village and a signature on the chain, side by side.
const txColour = { auction: '#0b6', borrow: '#c77700', repay: '#1a7f37', liquidate: '#b00', purses: '#06c', settle: '#666' };
function txFeed() {
  const rounds = (last.events ?? []).filter(e => e.type === 'round' && e.sigs?.length);
  const rows = rounds.slice(0, 6).flatMap(e => e.sigs.map(t => {
    const moves = (t.moves ?? []).map(m =>
      `<div style="padding-left:14px" class="muted">${m.from} → ${m.to} <b>${(m.amount / 100).toFixed(2)}</b></div>`).join('');
    return `<div style="color:${txColour[t.kind] ?? '#333'}">r${e.round} · ${t.what} ` +
      `<a target="_blank" href="${txUrl(t.sig)}" title="${t.sig}">${t.sig.slice(0, 8)}… ↗</a></div>${moves}`;
  }));
  $('txfeed').innerHTML =
    `<div class="head"><b>on the chain</b><span class="muted">every village act, as a signature</span></div>` +
    `<div style="line-height:1.45; max-height:260px; overflow-y:auto">${rows.join('') || 'waiting for the first round…'}</div>`;
}

// ---- a small live chart: price as a step line (it only changes when a trade clears),
//      volume as bars underneath, hover shows the exact round.
function chart(g) {
  const el = $('c' + g), s = last, h = s.history, name = GN[g];
  const W = 300, PH = 90, VH = 24, PAD = 36, top = 6, vTop = top + PH + 8, H = vTop + VH + 14;
  const now = s.prices[name], first = h.length ? h[0].prices[g] : now;
  const chg = first ? (now - first) / first * 100 : 0;
  const head = `<div class="head"><b>${name}</b><span>${now.toFixed(2)} ` +
    `<span class="${chg > 0 ? 'up' : chg < 0 ? 'down' : ''}">${chg > 0 ? '+' : ''}${chg.toFixed(1)}%</span></span></div>`;
  if (h.length < 2) { el.innerHTML = head + '<div style="color:#888;padding:30px 0">waiting for rounds…</div>'; return; }

  const ps = h.map(x => x.prices[g]), vs = h.map(x => x.volumes[g]);
  let lo = Math.min(...ps), hi = Math.max(...ps);
  if (hi - lo < 0.01) { lo -= 0.5; hi += 0.5; }               // flat line: give it room
  const pad = (hi - lo) * 0.15; lo -= pad; hi += pad;
  const vmax = Math.max(1, ...vs);
  const x = i => PAD + i / (h.length - 1) * (W - PAD - 4);
  const y = p => top + (hi - p) / (hi - lo) * PH;

  let d = `M${x(0)},${y(ps[0])}`;
  for (let i = 1; i < ps.length; i++) d += ` H${x(i)} V${y(ps[i])}`;
  const bw = Math.max(1, (W - PAD - 4) / h.length - 2);
  const bars = vs.map((v, i) => v ? `<rect x="${x(i) - bw / 2}" y="${vTop + VH - v / vmax * VH}" width="${bw}" height="${v / vmax * VH}" rx="1" fill="#9db4d6"/>` : '').join('');

  const k = hover[g];
  const tip = k == null ? '' :
    `<line x1="${x(k)}" x2="${x(k)}" y1="${top}" y2="${vTop + VH}" stroke="#999" stroke-dasharray="2 2"/>` +
    `<circle cx="${x(k)}" cy="${y(ps[k])}" r="4" fill="#2458a6" stroke="#fff" stroke-width="2"/>` +
    `<text x="${x(k) > W / 2 ? x(k) - 6 : x(k) + 6}" y="${top + 10}" text-anchor="${x(k) > W / 2 ? 'end' : 'start'}" font-size="10" fill="#111">` +
    `round ${h[k].round} · ${ps[k].toFixed(2)} · ${vs[k]} sold</text>`;

  el.innerHTML = head + `<svg viewBox="0 0 ${W} ${H}">
    <line x1="${PAD}" x2="${W - 4}" y1="${y(hi - pad)}" y2="${y(hi - pad)}" stroke="#eee"/>
    <line x1="${PAD}" x2="${W - 4}" y1="${y(lo + pad)}" y2="${y(lo + pad)}" stroke="#eee"/>
    <text x="${PAD - 4}" y="${y(hi - pad) + 3}" text-anchor="end" font-size="9" fill="#888">${(hi - pad).toFixed(2)}</text>
    <text x="${PAD - 4}" y="${y(lo + pad) + 3}" text-anchor="end" font-size="9" fill="#888">${(lo + pad).toFixed(2)}</text>
    <path d="${d}" fill="none" stroke="#2458a6" stroke-width="2" stroke-linejoin="round"/>
    <text x="${PAD - 4}" y="${vTop + VH}" text-anchor="end" font-size="9" fill="#888">vol</text>
    ${bars}
    <text x="${PAD}" y="${H - 2}" font-size="9" fill="#888">round ${h[0].round}</text>
    <text x="${W - 4}" y="${H - 2}" text-anchor="end" font-size="9" fill="#888">round ${h.at(-1).round}</text>
    ${policyMarks(h, x, top, vTop + VH)}
    ${tip}
    <rect x="${PAD}" y="0" width="${W - PAD}" height="${H}" fill="transparent" data-g="${g}"/>
  </svg>`;
  const hit = el.querySelector('rect[data-g]');
  hit.onmousemove = ev => {
    const r = hit.getBoundingClientRect(), fx = (ev.clientX - r.left) / r.width;
    hover[g] = Math.max(0, Math.min(h.length - 1, Math.round(fx * (h.length - 1)))); chart(g);
  };
  hit.onmouseleave = () => { hover[g] = null; chart(g); };
}

// ---- a multi-line chart over rounds. series: [{ name, color, get(h), dash?, legend? }]
//      stacked: draw as stacked bars instead (for counts that add up, like jobs).
//      w / ph: size in svg units (the big charts are wider and taller, with bigger text);
//      ref: a dashed reference level; tip(k): the hover text for round index k.
const khover = {};
function lines(id, title, series, opts = {}) {
  const { fmt = v => v.toFixed(0), stacked = false, note = '', zero = true, w = 300, ph = 110, ref = null, tip: tipText = null, sub = '' } = opts;
  const el = $(id), h = last.history, W = w, PH = ph, big = W > 400, fs = big ? 11 : 9, PAD = big ? 52 : 40, top = 6, H = top + PH + (big ? 34 : 30);
  const legend = series.filter(s => s.legend !== false).map(s =>
    `<span style="color:${s.color}; white-space:nowrap">■ ${s.name} ${s.label ? s.label() : fmt(h.length ? s.get(h.at(-1)) : 0)}</span>`).join('  ');
  const head = `<div class="head"><b>${title}</b><span class="muted">${sub}</span></div><div style="font-size:${big ? 12 : 11}px">${legend}</div>`;
  if (h.length < 2) { el.innerHTML = head + '<div style="color:#888;padding:30px 0">waiting for rounds…</div>'; return; }
  const vals = series.map(s => h.map(s.get));
  const tops = stacked ? h.map((_, i) => vals.reduce((t, v) => t + v[i], 0)) : vals.flat();
  const all = ref == null ? vals.flat() : [...vals.flat(), ref];
  let lo = stacked || zero ? Math.min(0, ...all) : Math.min(...all), hi = Math.max(zero ? 1 : lo + 1, ...tops, ...(ref == null ? [] : [ref]));
  if (!zero) { const p = (hi - lo) * 0.1; lo -= p; hi += p; }
  const x = i => PAD + i / (h.length - 1) * (W - PAD - 4);
  const y = v => top + (hi - v) / (hi - lo) * PH;
  let body = '';
  if (stacked) {
    const bw = Math.max(1, (W - PAD - 4) / h.length - 1);
    h.forEach((_, i) => { let acc = 0; series.forEach((s, k) => { const v = vals[k][i]; if (!v) return;
      body += `<rect x="${x(i) - bw / 2}" y="${y(acc + v)}" width="${bw}" height="${y(acc) - y(acc + v)}" fill="${s.color}"/>`; acc += v; }); });
  } else {
    series.forEach((s, k) => { const d = vals[k].map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
      if (s.area) body += `<path d="${d} L${x(h.length - 1).toFixed(1)},${y(lo)} L${x(0).toFixed(1)},${y(lo)} Z" fill="${s.color}" opacity="0.12"/>`;
      body += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width ?? 2}" stroke-linejoin="round" ${s.dash ? 'stroke-dasharray="4 3"' : ''}/>`; });
  }
  const refLine = ref == null ? '' : `<line x1="${PAD}" x2="${W - 4}" y1="${y(ref)}" y2="${y(ref)}" stroke="#aaa" stroke-dasharray="4 3"/>` +
    (Math.min(Math.abs(y(ref) - y(lo)), Math.abs(y(ref) - y(hi))) < fs + 2 ? '' :   // no label when it would sit on an axis label
    `<text x="${PAD - 4}" y="${y(ref) + 3}" text-anchor="end" font-size="${fs}" fill="#888">${fmt(ref)}</text>`);
  const k = khover[id];
  const tip = k == null ? '' : `<line x1="${x(k)}" x2="${x(k)}" y1="${top}" y2="${top + PH}" stroke="#999" stroke-dasharray="2 2"/>` +
    `<text x="${x(k) > W / 2 ? x(k) - 6 : x(k) + 6}" y="${top + fs + 1}" text-anchor="${x(k) > W / 2 ? 'end' : 'start'}" font-size="${fs + 1}" fill="#111" stroke="#fff" stroke-width="3" paint-order="stroke">` +
    `r${h[k].round}: ${tipText ? tipText(k) : series.filter(s => s.legend !== false).map((s, j) => `${s.name} ${fmt(vals[series.indexOf(s)][k])}`).join(', ')}</text>`;
  el.innerHTML = head + `<svg viewBox="0 0 ${W} ${H}">
    <line x1="${PAD}" x2="${W - 4}" y1="${y(hi)}" y2="${y(hi)}" stroke="#eee"/><line x1="${PAD}" x2="${W - 4}" y1="${y(lo)}" y2="${y(lo)}" stroke="#ccc"/>
    <text x="${PAD - 4}" y="${y(hi) + 3}" text-anchor="end" font-size="${fs}" fill="#888">${fmt(hi)}</text>
    <text x="${PAD - 4}" y="${y(lo) + 3}" text-anchor="end" font-size="${fs}" fill="#888">${fmt(lo)}</text>
    ${opts.grid ? [1 / 3, 2 / 3].map(f => { const v = lo + (hi - lo) * f; return `<line x1="${PAD}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}" stroke="#f0f0f0"/>` +
      `<text x="${PAD - 4}" y="${y(v) + 3}" text-anchor="end" font-size="${fs}" fill="#aaa">${fmt(v)}</text>`; }).join('') : ''}
    ${refLine}${body}
    <text x="${PAD}" y="${top + PH + fs + 3}" font-size="${fs}" fill="#888">round ${h[0].round}</text>
    <text x="${W - 4}" y="${top + PH + fs + 3}" text-anchor="end" font-size="${fs}" fill="#888">round ${h.at(-1).round}</text>
    <text x="${PAD}" y="${H - 2}" font-size="${fs}" fill="#666">${note}</text>
    ${policyMarks(h, x, top, top + PH)}
    ${tip}<rect x="${PAD}" y="0" width="${W - PAD}" height="${top + PH}" fill="transparent" data-k="1"/></svg>`;
  const hit = el.querySelector('rect[data-k]'), redraw = () => lines(id, title, series, opts);
  hit.onmousemove = ev => { const r = hit.getBoundingClientRect();
    khover[id] = Math.max(0, Math.min(h.length - 1, Math.round((ev.clientX - r.left) / r.width * (h.length - 1)))); redraw(); };
  hit.onmouseleave = () => { khover[id] = null; redraw(); };
}
const BIG = { w: 640, ph: 160 };

// ---- a tiny sparkline for a tile
function spark(vals, color) {
  if (vals.length < 2) return '<svg></svg>';
  let lo = Math.min(...vals), hi = Math.max(...vals); if (hi - lo < 1e-9) { lo -= 1; hi += 1; }
  const pts = vals.map((v, i) => `${(i / (vals.length - 1) * 100).toFixed(2)},${(24 - (v - lo) / (hi - lo) * 22).toFixed(2)}`).join(' ');
  return `<svg viewBox="0 0 100 26" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
}

// average of a per-round series over the last k rounds (per-round numbers are noisy)
const rolling = (get, k) => last.history.map((_, i, h) => { const w = h.slice(Math.max(0, i - k + 1), i + 1).map(get).filter(v => v != null);
  return w.length ? w.reduce((s, v) => s + v, 0) / w.length : 0; });

// ---- the tiles: value, sparkline, and the full chart they open into
let openTile = null;
const TILES = [
  { id: 'infl', label: 'inflation', sub: '20 rds', color: '#b00',
    val: m => m.inflation == null ? 'n/a' : pct(m.inflation), spark: x => x.priceIndex,
    full: () => lines('tile-chart', 'price index (1 = start)', [
      { name: 'index', color: '#b00', get: x => x.priceIndex },
    ], { ...BIG, ph: 100, w: 1000, fmt: v => v.toFixed(2), zero: false, ref: 1, note: 'the basket at last prices; inflation = its change over the last 20 rounds' }) },
  { id: 'wb', label: 'wellbeing', sub: 'per round', color: '#1a7f37',
    val: m => (m.wb5 >= 0 ? '+' : '') + (m.wb5 ?? 0).toFixed(2), spark: x => x.wb5,
    full: () => lines('tile-chart', 'wellbeing per agent', [
      { name: 'total so far', color: '#2458a6', get: x => x.wellbeing },
      { name: 'per round (5-round avg)', color: '#1a7f37', get: x => x.wb5 },
    ], { ...BIG, ph: 100, w: 1000, fmt: v => v.toFixed(1), note: 'average over agents' }) },
  { id: 'emp', label: 'employment', sub: '5-rd avg', color: '#1a7f37',
    val: m => m.emp5.toFixed(0) + '%', spark: x => x.emp5,
    full: () => lines('tile-chart', 'employment %', [
      { name: 'worked, 5-round avg', color: '#1a7f37', get: x => x.emp5 },
    ], { ...BIG, ph: 100, w: 1000, note: 'worked / all shifts finished; the remainder sat idle' }) },
  { id: 'gini', label: 'inequality', sub: 'Gini', color: '#7b4fb0',
    val: m => m.gini.toFixed(2), spark: x => x.gini,
    full: () => lines('tile-chart', 'inequality (Gini, net worth)', [
      { name: 'gini', color: '#7b4fb0', get: x => x.gini },
    ], { ...BIG, ph: 100, w: 1000, fmt: v => v.toFixed(2), note: '0 = equal; net worth at what goods sell for' }) },
  { id: 'houses', label: 'houses built', sub: '', color: '#c77700',
    val: m => `${m.housesBuilt ?? 0}`, spark: x => x.housesBuilt ?? 0,
    full: () => lines('tile-chart', 'houses', [
      { name: 'lived in', color: '#1a7f37', get: x => x.homeowners },
      { name: 'being built', color: '#c77700', get: x => x.building },
      { name: 'built (total)', color: '#2458a6', get: x => x.housesBuilt, dash: true },

  { id: 'bank', label: 'bank capital', sub: 'equity', color: '#2458a6',
    val: m => m.equity.toFixed(1), spark: x => x.equity,
    full: () => lines('tile-chart', 'bank capital (totals)', [
      { name: 'equity', color: '#2458a6', get: x => x.equity },
      { name: 'written off', color: '#b00', get: x => x.writtenOff },
      { name: 'bad debt', color: '#b00', get: x => x.badDebt, dash: true },
    ], { ...BIG, ph: 100, w: 1000, fmt: v => v.toFixed(1), note: 'write-offs: a running total' }) },
];
$('tiles').innerHTML = TILES.map(t => `<div class="tile" id="t-${t.id}" title="click for the full chart"></div>`).join('');
TILES.forEach(t => { $('t-' + t.id).onclick = () => { openTile = openTile === t.id ? null : t.id; tiles(); }; });

function tiles() {
  const h = last.history, m = h.at(-1);
  if (!m) return;
  for (const t of TILES) {
    const el = $('t-' + t.id);
    el.classList.toggle('on', openTile === t.id);
    el.innerHTML = `<div class="lab"><span>${t.label}</span><span>${t.sub}</span></div>` +
      `<div class="val">${t.val(m)}</div>${spark(h.map(t.spark), t.color)}`;
  }
  const t = TILES.find(t => t.id === openTile);
  if (!t) { $('tile-open').innerHTML = ''; return; }
  if (!$('tile-chart')) $('tile-open').innerHTML = '<div class="chart" id="tile-chart"></div>';
  t.full();
}

// ---- the headline charts
function bigCharts() {
  const h = last.history, b = last.bank;
  const g0 = h.slice(0, 5).reduce((t, x) => t + (x.realGdp ?? x.gdp), 0) / Math.min(5, h.length), gNow = h.at(-1).gdp10;
  const chg = g0 ? (gNow / g0 - 1) * 100 : 0;
  lines('k-gdp', 'real GDP per round', [
    { name: '3-round avg', color: '#9db4d8', get: x => x.gdp3, width: 1.2 },
    { name: '10-round avg', color: '#2458a6', get: x => x.gdp10, width: 3, area: true },
  ], { ...BIG, zero: false, grid: true, ref: g0, fmt: v => v.toFixed(0),
       sub: h.length > 5 ? `<b style="color:${chg >= 0 ? '#1a7f37' : '#b00'}">${chg >= 0 ? '▲ +' : '▼ '}${chg.toFixed(1)}%</b> vs the first rounds (dashed line)` : '',
       note: 'everything made this round — fish, wood, nets, houses — valued at fixed opening prices, so price changes don\'t show up as growth' });

  lines('k-money', 'money & credit', [
    { name: 'money supply', color: '#2458a6', get: x => x.supply, width: 3 },
    { name: 'credit outstanding', color: '#c77700', get: x => x.debt, width: 3 },
    { name: 'lending cap', color: '#c77700', get: x => x.lendingCap, dash: true, width: 1 },
  ], { ...BIG, fmt: v => v.toFixed(0), ref: b.startSupply,
       sub: b.creditOn ? `${(b.ratePerMin * 100).toFixed(1)}%/min ≈ ${(b.ratePerRound * 100).toFixed(2)}%/round` : 'credit switched off',
       note: `dashed grey = starting money ${b.startSupply.toFixed(0)}; above it, loans minted the difference` });

  // every good as % of its first-round price, so one chart reads for all five; hover shows actual prices
  const base = GN.map((_, g) => h.find(x => x.prices[g] > 0)?.prices[g] ?? 1);
  const now = h.at(-1)?.prices ?? [];
  lines('k-prices', 'prices', SHOWN.map(g => ({
    name: GN[g], color: GC[g], get: x => x.prices[g] / base[g] * 100,
    label: () => now.length ? `${now[g].toFixed(2)} <span class="${now[g] > base[g] ? 'up' : now[g] < base[g] ? 'down' : 'muted'}">${pct(now[g] / base[g] - 1)}</span>` : '',
  })), { ...BIG, zero: false, ref: 100, fmt: v => v.toFixed(0) + '%',
         tip: k => SHOWN.map(g => `${GN[g]} ${h[k].prices[g].toFixed(2)}`).join('  '),
         note: '% of each good\'s round-1 price (dashed = 100%); hover for prices in coins' });

  lines('k-jobs', 'what agents are doing', [
    { name: 'fish', color: '#2f7fc1', get: x => x.doing.gather_food },
    { name: 'wood', color: '#8a5a2b', get: x => x.doing.gather_wood },
    { name: 'craft', color: '#7b4fb0', get: x => x.doing.craft_net },
    { name: 'build', color: '#c77700', get: x => x.doing.build_house ?? 0 },
    { name: 'idle', color: '#bbb', get: x => x.doing.idle },
  ], { ...BIG, stacked: true, note: 'agents on each job, per round' });
}

// ---- the charts inside "details"
function detailCharts() {
  const m = last.history.at(-1);
  lines('k-fore', 'loans come due (total)', [
    { name: 'collected', color: '#1a7f37', get: x => x.autoRepaid ?? 0 },
    { name: 'foreclosed overdue', color: '#c77700', get: x => x.overdue },
  ], { note: 'collected = from cash when due, no penalty' });
  lines('k-needs', 'hungry / cold agents', [
    { name: 'hungry', color: '#b00', get: x => x.hungry },
    { name: 'cold', color: '#2a9dbf', get: x => x.cold },
  ], { note: `out of ${last.agents.length} agents` });
  lines('k-held', 'goods held by agents', SHOWN.map(g => ({ name: GN[g], color: GC[g], get: x => x.held[g] ?? 0 })),
    { note: 'rising = glut piling up, falling = scarcity' });
  lines('k-slack', 'slack: offered, unsold', [
    { name: 'value', color: '#c77700', get: x => x.slack },
  ], { fmt: v => v.toFixed(1), note: `last round ${m.slackShare == null ? '—' : Math.round(m.slackShare * 100) + '%'} of the value offered didn't sell` });
  SHOWN.forEach(g => chart(g));
}

function econ() {
  const h = last.history;
  if (!h.length || h[0].gdp === undefined || h[0].supply === undefined) return;
  const gdp10 = rolling(x => x.realGdp ?? x.gdp, 10), gdp3 = rolling(x => x.realGdp ?? x.gdp, 3), emp5 = rolling(x => x.employment, 5), wb5 = rolling(x => x.wbRound, 5);
  h.forEach((x, i) => { x.gdp10 = gdp10[i]; x.gdp3 = gdp3[i]; x.emp5 = emp5[i] * 100; x.wb5 = wb5[i]; });
  tiles(); bigCharts();
  if (detailsOpen()) detailCharts();
}

// ---- who's winning: cash to the right, debt to the left, net worth (cash + goods at what they sell for − debt) on the right
function wealth() {
  const ag = [...last.agents].sort((a, b) => b.wealth - a.wealth);
  const max = Math.max(1, ...ag.map(a => Math.max(a.cash, a.debt))), start = last.bank.startSupply / ag.length;
  const W = 640, L = 96, mid = L + 90, R = W - 70, row = 15, fs = 11;
  const sx = v => v / max * (R - mid);
  const bars = ag.map((a, i) => { const yy = i * row + 14;
    return `<text x="0" y="${yy + 10}" font-size="${fs}">${i + 1}. ${a.name}</text>` +
      (a.debt ? `<rect x="${mid - Math.min(sx(a.debt), mid - L)}" y="${yy + 2}" width="${Math.min(sx(a.debt), mid - L)}" height="${row - 4}" fill="#c77700"/>` : '') +
      `<rect x="${mid}" y="${yy + 2}" width="${sx(a.cash)}" height="${row - 4}" fill="${a.cash - a.debt >= start ? '#1a7f37' : '#8fbf9a'}"/>` +
      `<text x="${W}" y="${yy + 10}" font-size="${fs}" text-anchor="end">${a.wealth.toFixed(2)}</text>`; }).join('');
  const sLine = mid + sx(start), Hh = ag.length * row + 20;
  $('wealth').innerHTML = `<div class="head"><b>who's winning</b><span class="muted">net worth →</span></div>` +
    `<div style="font-size:12px"><span style="color:#c77700">■ debt</span>  <span style="color:#1a7f37">■ cash (dark = above starting cash)</span>  ` +
    `<span class="muted">net worth = cash + goods − debt</span></div>` +
    `<svg viewBox="0 0 ${W} ${Hh}">${bars}` +
    `<line x1="${sLine}" x2="${sLine}" y1="10" y2="${ag.length * row + 16}" stroke="#999" stroke-dasharray="3 3"/>` +
    `<text x="${sLine + 3}" y="9" font-size="10" fill="#888">start ${start.toFixed(0)}</text>` +
    `<line x1="${mid}" x2="${mid}" y1="10" y2="${ag.length * row + 16}" stroke="#333"/></svg>`;
}

function bankFeed() {
  const words = { borrow: '#c77700', repay: '#1a7f37', collected: '#1a7f37', foreclosed: '#b00' };
  const items = last.bankFeed.map(f => `<div style="color:${f.ok === false ? '#888' : words[f.kind]}">r${f.round} · ${f.name} ` + (
    f.kind === 'borrow' ? `${f.ok === false ? 'refused: borrow' : 'borrowed'} ${f.amount.toFixed(2)}${f.term ? ` for ${f.term} rounds` : ' (top-up)'}`
    : f.kind === 'repay' ? `${f.ok === false ? 'refused: repay' : 'repaid'} ${f.amount.toFixed(2)}`
    : f.kind === 'collected' ? `loan due: ${f.amount.toFixed(2)} collected from cash, no penalty`
    : `<b>FORECLOSED</b> (overdue) on ${(f.debt ?? 0).toFixed(2)}: ${f.amount.toFixed(2)} cash taken` +
      (f.seized?.some(q => q) ? `, seized ${goodsList(f.seized)}` : '') + (f.refund ? `, refunded ${f.refund.toFixed(2)}` : '') +
      (f.returned?.some(q => q) ? `, returned ${goodsList(f.returned)}` : '')) +
    (f.sig ? ` <a target="_blank" href="${txUrl(f.sig)}">tx ↗</a>` : '') +
    `</div>`).join('');
  const b = last.bank;
  $('bankfeed').innerHTML = `<div class="head"><b>the bank</b><span class="muted">keeper ${b.keeper.slice(0, 8)}… signs foreclosures, not the server</span></div>` +
    `<div style="line-height:1.5">owed <b>${b.debt.toFixed(2)}</b> of cap ${b.lendingCap.toFixed(2)} · equity <b>${b.equity.toFixed(2)}</b> (must keep ${b.capitalRequired.toFixed(2)})<br>` +
    `due loans: <span class="up">${b.autoRepaid} collected</span> · <span class="down">${b.overdue} overdue foreclosures</span><br>` +
    `written off ${b.books.writtenOff.toFixed(2)} · bad debt ${b.badDebt.toFixed(2)}` +
    (b.creditOn ? '' : `<br><span class="down">credit is switched off: the chain refuses every loan</span>`) +
    (b.goods.some(q => q) ? `<br>seized, for sale: ${goodsList(b.goods)}` : '') + `</div>` +
    `<div class="feed">${items || '<div style="color:#888">no loans yet</div>'}</div>`;
}

// ---- the market right now: last round's book before clearing (top levels a side), what cleared, the latest trades
function book() {
  const m = last.market, lv = ls => ls.map(([p, q]) => `${(p / 100).toFixed(2)}×${q}`).join(' · ');
  const rows = m.ladder.length ? m.ladder.map(l =>
    `<tr><td>${l.good}</td><td class="n">${l.bids.count ? lv(l.bids.top) + (l.bids.more ? ` <span style="color:#888">+${l.bids.more}</span>` : '') : '—'}</td>` +
    `<td class="n">${l.asks.count ? lv(l.asks.top) + (l.asks.more ? ` <span style="color:#888">+${l.asks.more}</span>` : '') : '—'}</td>` +
    `<td class="n">${l.sold ? `${l.sold} @ ${l.price.toFixed(2)}` : '—'}</td><td class="n">${l.offered - l.sold || ''}</td>` +
    `<td>${l.bankSale ? `bank ${l.bankSale.qty} @ ${l.bankSale.price.toFixed(2)}` : ''}</td></tr>`).join('')
    : '<tr><td colspan="6" style="color:#888">no round yet</td></tr>';
  const trades = m.trades.map(t => `<div>r${t.round} · ${t.name} bought ${t.qty} ${t.good} @ ${t.price.toFixed(2)}</div>`).join('');
  $('book').innerHTML =
    `<b>order book, last round before clearing</b> <span style="color:#666">${m.live} of ${last.agents.length} agents had an order</span>` +
    `<div class="scroll"><table style="margin:4px 0 8px"><tr><th></th><th class="n">bids (price×qty)</th><th class="n">asks (price×qty)</th>` +
    `<th class="n">sold</th><th class="n">unsold</th><th>next: bank sale</th></tr>${rows}</table></div>` +
    `<b>latest trades</b>${trades || '<div style="color:#888">none yet</div>'}`;
}

function agentTable() {
  if (!last?.agents) return;
  const ag = [...last.agents].sort((a, b) => b.wealth - a.wealth), shown = showAll ? ag : ag.slice(0, 10);
  $('allbtn').textContent = showAll ? 'top 10 only' : `show all ${ag.length}`;
  // the column earns its place only when the village is of more than one mind
  rows.closest('table').classList.toggle('nomodels', new Set(ag.map(a => a.model).filter(Boolean)).size < 2);
  rows.innerHTML = shown.map(a =>
    `<tr><td>${a.name}</td><td>${a.skills.gather_food} / ${a.skills.gather_wood} / ${a.skills.craft_net}</td><td>${a.activity}</td><td class="n">${a.cash.toFixed(2)}</td>` +
    `<td class="n">${a.food}</td><td class="n">${a.wood}</td><td class="n">${a.nets}</td>` +
    `<td>${a.house ? 'home' + (a.houses > 1 ? ` +${a.houses - 1}` : '') : ''}${a.building != null ? `${a.house ? ', ' : ''}building ${a.building}/${a.buildShifts ?? 0}` : ''}${!a.house && a.building == null && a.houses ? a.houses : ''}</td>` +
    `<td class="n ${a.hunger ? 'hungry' : ''}">${a.hunger || ''}</td>` +
    `<td class="n ${a.cold >= 2 ? 'hungry' : ''}">${a.cold || ''}</td>` +
    `<td class="n">${a.wellbeing.toFixed(1)}</td><td class="n">${a.wealth.toFixed(2)}</td>` +
    `<td class="n">${a.debt ? a.debt.toFixed(2) : ''}</td>` +
    `<td class="n ${a.dueIn !== null && a.dueIn <= 1 ? 'hungry' : ''}">${a.dueIn === null ? '' : a.dueIn + ' r'}</td>` +
    `<td class="model" title="${esc(a.model || '')}">${a.model ? esc(a.model.split('/').pop()) : ''}</td>` +
    `<td class="t">${a.orders.join('<br>')}</td>` +
    `<td class="t" title="${(a.memory || []).join('\n').replace(/"/g, '&quot;')}">${a.thought}</td></tr>`
  ).join('');
}

// everything inside "details": drawn only while it's open
function details() {
  const s = last;
  if (!detailsOpen()) return;
  book(); agentTable();
  const prices = Object.keys(s.prices).map(g => `${g} ${s.prices[g].toFixed(2)} (${s.volumes[g]} sold)`).join(' · ');
  const doing = Object.entries(s.doing).map(([k, v]) => `${k} ${v}`).join(' · ');
  world.innerHTML =
    (s.decide ? `last round waited ${(s.decide.slowest / 1000).toFixed(1)}s for the slowest agent (median ${(s.decide.median / 1000).toFixed(1)}s)` +
      (s.decide.timeouts ? `, <span class="hungry">${s.decide.timeouts} timed out</span> and kept their last job` : '') + '<br>' : '') +
    `prices: ${prices}<br>` +
    `doing: ${doing}<br>` +
    `totals: money ${s.totals.money.toFixed(2)} · food ${s.totals.food} · wood ${s.totals.wood} · nets ${s.totals.nets} · ` +
    `houses ${s.totals.houses} owned by ${s.totals.homeowners}, ${s.totals.building} being built (${s.totals.housesBuilt} built) · ` +
    `<span class="hungry">hungry ${s.totals.hungry} · cold ${s.totals.cold}</span><br>` +
    `bank: income: interest ${s.bank.books.interestIncome.toFixed(2)} · penalties ${s.bank.books.penalties.toFixed(2)} · sales ${s.bank.books.recovered.toFixed(2)} · ` +
    (s.bank.creditOn ? `loans run ${s.bank.terms} rounds` : 'credit off') + '<br>' +
    (s.metrics ? `economy (last round): GDP ${s.metrics.gdp.toFixed(2)} · price index ${s.metrics.priceIndex.toFixed(2)}` +
      ` · employment ${s.metrics.employment == null ? '—' : Math.round(s.metrics.employment * 100) + '%'} · slack ${s.metrics.slack.toFixed(2)}` +
      ` · sold through the market ${Math.round((s.metrics.tradedShare ?? 0) * 100)}% of output` +
      ` · wellbeing ${s.metrics.wellbeing.toFixed(1)} avg · gini ${s.metrics.gini.toFixed(2)} · credit ${s.metrics.credit.toFixed(2)} · money ${s.metrics.money.toFixed(2)}` : '');
  events.innerHTML = s.events.map(e => e.type === 'error'

      (e.sigs?.length ? ' · ' + e.sigs.map(t => `<a target="_blank" href="${txUrl(t.sig)}" title="${t.what}">${t.what.split(' ')[0]} ↗</a>`).join(' · ') : '') + `</div>`
  ).join('') || 'waiting for first market round…';
}
$('more').addEventListener('toggle', () => { if (last?.running) { details(); econ(); } });

// ---- the control panel ----------------------------------------------------------
// One slider per dial in backend/src/tunables.mjs. Dragging one posts it; the simulation
// reads CFG every round, so the change lands on the next one. Nothing here is a special
// "disaster" mechanism — a hurricane is the houses-lost dial, and that is the point.
let dials = null;                 // the last /tunables snapshot
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function toggleDials() {
  const open = $('panel').classList.toggle('open');
  document.body.classList.toggle('dials-open', open);
  if (open && !dials) loadDials();
}

// A panel that fails silently is worse than no panel: say so on the page.
async function loadDials() {
  try {
    const r = await fetch('/tunables');
    if (!r.ok) throw new Error(`/tunables returned ${r.status}`);
    dials = await r.json();
    if (!dials?.tunables?.length) throw new Error('/tunables returned no dials');
    drawDials();
  } catch (e) {
    dials = null;
    console.error('loadDials:', e);
    $('dialgroups').innerHTML = `<div class="hungry">could not load the dials: ${esc(e.message)}` +
      `<br><button onclick="loadDials()" style="margin-top:6px">try again</button></div>`;
  }
}

// POST one dial (or a preset) and redraw from the snapshot that comes back.
async function post(body) {
  dials = await (await fetch('/tunables', { method: 'POST', headers: { 'content-type': 'application/json' },
                                            body: JSON.stringify(body) })).json();
  drawDials();
  refresh();
}
let pending = null;               // debounce: a drag posts once it settles, not per pixel
function slide(key, raw, el) {
  const t = dials.tunables.find(d => d.key === key);
  const v = t.int ? Math.round(+raw) : +raw;
  el.closest('.dial').querySelector('.dv').textContent = fmtDial(t, v);
  clearTimeout(pending);
  pending = setTimeout(() => post({ changes: { [key]: v } }), 120);
}
// The server is the authority on how a value reads; this is only what the label says while
// a slider is still moving, so it matches the same rounding.
function fmtDial(t, v) {
  if (t.bool) return v ? 'on' : 'off';
  const d = Math.max(0, (String(t.step).split('.')[1] ?? '').length);
  return t.shown.includes('%') ? `${+(v * 100).toFixed(1)}%`
       : t.shown.endsWith('×') ? `${+v.toFixed(2)}×`
       : t.shown.endsWith('s') && t.key.endsWith('_MS') ? `${(v / 1000).toFixed(1)}s`
       : String(+v.toFixed(d));
}

function drawDials() {
  if (!dials) return;
  $('presets').innerHTML = (dials.presets ?? []).map(p =>
    `<button class="${p.id === 'baseline' ? 'base' : ''}" title="${esc(p.note)}" onclick="post({preset:'${p.id}'})">${esc(p.label)}</button>`).join('');
  $('dialgroups').innerHTML = (dials.groups ?? []).map(g => {
    const ds = (dials.tunables ?? []).filter(t => t.group === g.id);
    if (!ds.length) return '';
    return `<div class="grp"><div class="gh">${esc(g.title)}</div><div class="gb">${esc(g.blurb)}</div>` +
      ds.map(t => `<div class="dial ${t.moved ? 'moved' : ''}" data-key="${esc(t.key)}">
        <div class="dl"><span title="${esc(t.key)}">${esc(t.label)}${t.live ? '' : '<span class="next">next run</span>'}</span>
          <span><b class="dv">${esc(t.shown)}</b>${t.moved ? `<button class="rst" title="back to ${esc(String(t.dflt))}" onclick="post({changes:{'${esc(t.key)}':${JSON.stringify(t.dflt)}}})">↺</button>` : ''}</span></div>` +
        (t.bool
          ? `<div><label><input type="checkbox" ${t.value ? 'checked' : ''} onchange="post({changes:{'${esc(t.key)}':this.checked}})"> ${esc(t.label)}</label></div>`
          : `<input type="range" min="${t.min}" max="${t.max}" step="${t.step}" value="${t.value}" oninput="slide('${esc(t.key)}', this.value, this)">`) +
        (t.help ? `<div class="dh">${esc(t.help)}</div>` : '') + `</div>`).join('') + '</div>';
  }).join('');
  policyFeed();
}

// What has been pulled this run, newest first — the same list the charts are marked from.
function policyFeed() {
  const p = last?.policy ?? [];
  $('pfeed').innerHTML = !p.length ? '<span class="muted">nothing pulled yet this run.</span>'
    : '<b>pulled this run</b>' + p.slice().reverse().slice(0, 12).map(e =>
        `<div>r${e.round} · ${e.changes.map(c => `${esc(c.label)} ${esc(c.fromShown)} → ${esc(c.toShown)}`).join('; ')}</div>`).join('');
}

// Where on a chart's x-axis a policy change landed: the first round at or after it.
function policyMarks(h, x, y1, y2) {
  return (last?.policy ?? []).map(p => {
    const i = h.findIndex(r => r.round >= p.round);
    if (i < 0) return '';
    const what = p.changes.map(c => `${c.label} ${c.fromShown} → ${c.toShown}`).join('\n');
    return `<line x1="${x(i)}" x2="${x(i)}" y1="${y1}" y2="${y2}" stroke="#c77700" stroke-width="1" stroke-dasharray="3 3" opacity=".75">` +
      `<title>round ${p.round}\n${what}</title></line>` +
      `<polygon points="${x(i) - 3},${y1} ${x(i) + 3},${y1} ${x(i)},${y1 + 4}" fill="#c77700" opacity=".75"/>`;
  }).join('');
}

// What each model in a mixed village is doing: how many villagers think with it, how often it
// answered, what it has cost so far. One model is the ordinary case, and says nothing extra.
function modelFeed(llm) {
  const by = Object.entries(llm?.byModel ?? {});
  const el = $('models');
  if (by.length < 2) { el.innerHTML = ''; return; }
  el.innerHTML = by.sort((a, b) => b[1].calls - a[1].calls).map(([slug, m]) =>
    `<b>${esc(slug.split('/').pop())}</b> ${m.agents} agents · ${m.calls} calls · $${m.cost.toFixed(3)}` +
    (m.timedOut ? ` · <span class="hungry">${m.timedOut} timed out</span>` : '') +
    (m.errors ? ` · <span class="hungry">${m.errors} errors</span>` : '')).join(' &nbsp;|&nbsp; ');
}

// Pick the brain for the next run: .env's choice is the default, and the picker is only
// shown between runs — a running village is bound to the brain (and models) it started with.
function brainPicker(s) {
  const pick = $('brainsel'), box = $('brainpick'), n = $('agentsel'), nbox = $('agentpick');
  box.hidden = nbox.hidden = s.running;
  if (s.running || !s.brains) return;
  if (pick.options.length !== s.brains.length) {
    pick.innerHTML = s.brains.map(b => `<option value="${b}">${b}</option>`).join('');
    pick.value = s.config.brain;
  }
  // .env's number to begin with, then whatever was typed — refreshing every few seconds
  // must not snatch the field back while it is being edited.
  n.max = s.maxAgents ?? 137;
  if (!n.value && document.activeElement !== n) n.value = s.config.agents;
}

async function toggle() {
  btn.disabled = true;
  statusEl.textContent = running ? 'stopping…' : 'starting (creating ledger on Solana)…';
  // the brain is chosen for the run that is starting; a run already going keeps its own
  await fetch(running ? '/stop' : '/start', running ? { method: 'POST' }
    : { method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ brain: $('brainsel').value, agents: +$('agentsel').value || undefined }) });
  btn.disabled = false;
  refresh();
}

async function refresh() {
  const s = await (await fetch('/state')).json();
  running = s.running;
  btn.textContent = running ? 'Stop' : 'Start simulation';
  brainPicker(s);
  if (!running) {
    statusEl.textContent = `${s.config.agents} agents, brain: ${s.config.brain}`;
    $('headline').innerHTML = 'not running'; $('dash').style.display = 'none';
    return;
  }
  last = s; $('dash').style.display = '';
  statusEl.innerHTML = `<b>round ${s.round}</b> · running ${s.seconds}s · brain: ${s.brain} · ${s.agents.length} agents`;
  $('headline').innerHTML =
    `a round takes ≈${(s.roundMs / 1000).toFixed(1)}s` +
    (s.decide?.timeouts ? ` · <span class="hungry">${s.decide.timeouts} timed out last round</span>` : '') +
    ` · solana: <b>${s.chain.transactions}</b> transactions · <a target="_blank" href="${s.chain.explorer}">ledger ${s.chain.ledger.slice(0, 8)}… ↗</a>` +
    ` · <a target="_blank" href="${s.chain.mintExplorer}" title="SETTLERS — the mint's authority is itself, a program address: no key that could mint one exists">SETTLERS ${s.chain.mint.slice(0, 8)}… ↗</a>` +
    (s.chain.settlers != null ? ` (${(s.chain.settlers / 100).toFixed(2)} in existence)` : '') +
    (s.llm.calls ? ` · llm ${s.llm.calls} calls ($${s.llm.cost.toFixed(3)})` : '') +
    ` · <span class="${s.totals.hungry ? 'hungry' : 'muted'}">hungry ${s.totals.hungry}</span> · <span class="${s.totals.cold ? 'hungry' : 'muted'}">cold ${s.totals.cold}</span>` +
    (s.foreclosures.length ? ` · <span class="hungry">latest foreclosure: r${s.foreclosures[0].round} ${s.foreclosures[0].name}</span>` : '');
  modelFeed(s.llm);
  econ(); wealth(); bankFeed(); txFeed(); details();
  if (dials) policyFeed();
}

refresh();
loadDials();
setInterval(refresh, 1000);
</script>
